version: "3.9"

services:
  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: betterdb-demo-valkey
    ports:
      # Override with VALKEY_HOST_PORT=6380 in .env if 6379 is already in use
      - "${VALKEY_HOST_PORT:-6379}:6379"
    command: >
      valkey-server
      --slowlog-log-slower-than 100
      --slowlog-max-len 10000
      --loglevel warning
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  valkey_data:

# Usage:
#   docker-compose up -d        → start Valkey
#   docker-compose ps           → check health
#   docker-compose logs valkey  → logs
#   docker-compose down         → stop + clean
#
# After Valkey is up:
#   Local Monitor (no Cloud):
#     docker run -d --name betterdb-monitor --network <compose_network> \
#       -p 3001:3001 -e DB_HOST=betterdb-demo-valkey -e DB_PORT=6379 \
#       -e STORAGE_TYPE=memory betterdb/monitor:latest
#     → http://localhost:3001
#   Cloud: Add Connection → Via Agent, then docker run betterdb/agent
#     (VALKEY_PORT on the agent = the host port, default 6379)
